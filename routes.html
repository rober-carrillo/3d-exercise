<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tus rutas · Salpicón!</title>
<meta name="description" content="Every route in your account and in this browser.">
<meta name="theme-color" content="#fcf1ee">
<script>try{var t=localStorage.getItem('salpicon.theme.v1');document.documentElement.dataset.theme=t==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="icon" href="./brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./brand/apple-touch-icon.png">
<link rel="stylesheet" href="./src/ui.css">
<style>
  body{min-height:100%;background:radial-gradient(120% 80% at 50% -10%,var(--bg-hi) 0%,var(--bg) 60%) fixed}
  .brand .mk{width:56px}
  .page-head h1{font-size:26px}

  /* the figures: what the whole library adds up to, and the best of it.
     A strip above the diary rather than a page of its own — the page it used
     to live on also listed every route, which is this page, and two lists of
     the same routes under different headings is one list too many. */
  .figures{margin-top:26px;padding:16px 18px 15px;display:flex;flex-direction:column;gap:13px}
  .figures dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:14px 20px;margin:0}
  .figures dt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .figures dd{margin:4px 0 0;font-size:21px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .figures dd small{font-size:11px;font-weight:500;color:var(--ink-2);margin-left:3px}
  .bests{display:flex;align-items:baseline;gap:8px 16px;flex-wrap:wrap;
    border-top:1px solid var(--line);padding-top:13px;font-size:12.5px;color:var(--ink-2)}
  .bests .lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .bests a{color:inherit;text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bests a:hover{color:var(--accent)}
  .bests a b{font-weight:650;color:var(--ink)}
  .bests .none{color:var(--ink-3)}
  .bests .busy{color:var(--ink-3);font-size:11.5px}

  /* signed out, this page has nothing of its own to show yet */
  .nowt{margin-top:34px;padding:30px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .nowt h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em}
  .nowt p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2);max-width:60ch}
  .nowt .acct-btns{margin-top:4px}

  #share{position:fixed;inset:0;z-index:61;display:none;align-items:center;justify-content:center;
    background:var(--scrim);backdrop-filter:blur(8px);padding:20px}
  #share.on{display:flex}
  .acct-card{width:min(420px,100%);padding:26px;display:flex;flex-direction:column;gap:14px}
  .acct-card h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em}
  .acct-msg{margin:4px 0 0;font-size:12.5px;line-height:1.5;min-height:1.2em;color:var(--hot)}
  .acct-msg.ok{color:var(--accent)}
  .acct-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .acct-btns button{flex:1 1 auto}
  .share-opts{display:flex;flex-direction:column;gap:2px}
  .share-opts label{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer}
  .share-opts label:hover{background:var(--fill)}
  .share-opts input{margin-top:3px;flex:0 0 auto}
  .share-opts span{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
  .share-opts b{display:block;font-size:14px;color:var(--ink);font-weight:600}
  .share-lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  #share-url{width:100%;font:inherit;font-size:13px;padding:10px 12px;border-radius:9px;margin-top:5px;
    border:1px solid var(--line-2);background:var(--bg-hi);color:var(--ink)}

  #drop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:var(--scrim);backdrop-filter:blur(6px)}
  #drop.on{display:flex}
  #drop div{border:2px dashed var(--accent);border-radius:18px;padding:44px 64px;font-size:15px;color:var(--ink)}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:40;
    padding:11px 18px;font-size:12.5px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:80vw}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="brand"><a href="./"><span id="brandmark"></span><h1 data-i18n="routes.title">Tus rutas</h1></a></div>
    <div class="nav">
      <a class="add quiet" href="./" data-i18n="nav.home" data-i18n-aria="nav.home">← Inicio</a>
      <button class="lang-btn" id="langbtn" type="button"></button>
      <button class="theme-btn" id="themebtn" type="button"></button>
      <button class="add quiet" id="acctbtn" hidden data-i18n="nav.signin">Entrar</button>
      <a class="add quiet" href="./library.html" data-i18n="nav.library">Rutas públicas</a>
      <a class="rec-btn" href="./?record=1"><i></i><span data-i18n="nav.record">Grabar</span></a>
      <button class="add quiet" id="add" data-i18n="nav.add">＋ Añadir un GPX</button>
    </div>
  </header>

  <div class="rv-panel nowt" id="nowt" hidden>
    <h2 data-i18n="routes.empty.title">Todavía no hay nada aquí</h2>
    <p id="nowt-why"></p>
    <div class="acct-btns" id="nowt-cta" hidden>
      <button class="add" id="nowt-up" data-i18n="hero.signup">Crear una cuenta</button>
      <button class="add quiet" id="nowt-in" data-i18n="hero.havaccount">Ya tengo una</button>
    </div>
  </div>

  <section class="rv-panel figures" id="figures" hidden>
    <dl id="totals"></dl>
    <div class="bests" id="bests"></div>
  </section>

  <div class="count" id="count"></div>
  <div id="grid"></div>

  <footer data-i18n-html="foot.short"></footer>
</div>

<input type="file" id="file" accept=".gpx,application/gpx+xml" multiple hidden>

<div id="share">
  <div class="acct-card rv-panel">
    <h2 data-i18n="share.title">¿Quién puede ver esta ruta?</h2>
    <div class="share-opts" id="share-opts">
      <label><input type="radio" name="vis" value="private"><span><b data-i18n="share.only">Solo yo</b>
        <span data-i18n="share.only.why">Nadie más puede abrirla, ni con la dirección.</span></span></label>
      <label><input type="radio" name="vis" value="link"><span><b data-i18n="share.link">Cualquiera con el enlace</b>
        <span data-i18n="share.link.why">No aparecerá en ningún sitio público. Solo las personas a quienes mandes el enlace.</span></span></label>
      <label><input type="radio" name="vis" value="public"><span><b data-i18n="share.pub">Pública</b>
        <span data-i18n="share.pub.why">Cualquiera puede encontrarla y abrirla.</span></span></label>
    </div>
    <div id="share-link" hidden>
      <label class="share-lbl" for="share-url" data-i18n="share.label">Enlace</label>
      <input id="share-url" readonly>
      <div class="acct-btns">
        <button type="button" class="add" id="share-copy" data-i18n="share.copy">Copiar enlace</button>
        <button type="button" class="add quiet" id="share-rotate"
          data-i18n="share.replace" data-i18n-title="share.replace.hint">Reemplazar enlace</button>
      </div>
    </div>
    <p class="acct-msg" id="share-msg" role="status"></p>
    <div class="acct-btns">
      <button type="button" class="add quiet" id="share-close" data-i18n="share.done">Listo</button>
    </div>
  </div>
</div>

<div class="ask" id="ask">
  <div class="ask-card rv-panel">
    <h2 data-i18n="del.title">¿Borrar esta ruta?</h2>
    <p id="ask-body"></p>
    <div class="ask-btns">
      <button type="button" class="danger" id="ask-yes" data-i18n="del.yes">Borrar</button>
      <button type="button" id="ask-no" data-i18n="del.no">Cancelar</button>
    </div>
  </div>
</div>

<div id="drop"><div data-i18n="routes.drop">Suelta archivos GPX para construirlos</div></div>
<div id="toast" class="rv-panel"></div>

<script type="module">
import { parseGPX, analyze, profileSamples, trackToGPX } from './src/gpx.js';
import { saveGPX, safeName } from './src/export.js';
import * as account from './src/account.js';
import { addLocalRoute, listLocalRoutes, removeLocalRoute } from './src/library.js';
import { routeDiary, escapeHtml, routeHref } from './src/cards.js';
import { EFFORTS, ON_FOOT, personalBests, totals, clock, pace } from './src/stats.js';
import { shareRoute, routeLink, canLink } from './src/share.js';
import { markSVG } from './src/mark.js';
import { lastDiag, summarise } from './src/diag.js';
import { initTheme, themeToggle } from './src/theme.js';
import { initLang, langToggle, t } from './src/i18n.js';
import { startSync, onSync } from './src/sync.js';

initTheme();
initLang();
themeToggle(document.getElementById('themebtn'));
langToggle(document.getElementById('langbtn'));
addEventListener('salpicon:lang', () => render());
document.getElementById('brandmark').innerHTML = markSVG({ juice: 1 });

const grid = document.getElementById('grid');
// The log the recorder kept for the most recent route, if there is one.
const diag = lastDiag();
const diagSlug = diag?.slug ?? null;
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 4200);
}

let cloudRoutes = [];                 // whatever the account holds, once fetched

/**
 * Pull the signed-in person's routes and redraw.
 *
 * A failure here is not fatal and must not empty the page: anything in this
 * browser is still perfectly good, so a dropped connection costs the cloud
 * list and nothing else.
 */
async function refreshCloud() {
  if (!account.enabled() || !account.user()) { cloudRoutes = []; render(); return; }
  try {
    cloudRoutes = (await account.routes().myRoutes()).map(r => ({ ...r, cloud: true }));
  } catch {
    cloudRoutes = [];
    toast(t('toast.noaccount'));
  }
  render();
  fetchEffortTracks();
}

const all = () => [...cloudRoutes, ...listLocalRoutes()];

/**
 * The buttons at the right-hand end of a row.
 *
 * One button and a menu. Sharing is the reason anybody keeps a route, so the
 * link stays where a thumb can reach it; the other four are housekeeping and
 * live behind the dots, where they can afford to say what they do in words
 * instead of being four more glyphs to decode.
 */
function actions(r) {
  const ident = `data-id="${r.id ?? ''}" data-slug="${r.slug ?? ''}"`;

  // The link button stays out on its own, because it is the one anybody
  // presses. Tapping it on a private route opens that route to its link and
  // copies it in the same action — sharing is what the button is for, so
  // asking first and then making somebody find the setting was two steps for
  // a decision they had already made by pressing it.
  const link = `<button class="dl copy" ${ident} title="${canLink(r) ? t('share.viewer') : t('share.local')}"
      aria-label="${canLink(r) ? t('share.viewer') : t('share.local')}"><i class="ic">🔗</i></button>`;

  // Everything else behind the dots. Five buttons abreast fitted a laptop and
  // nothing else: upright on a phone the row is about 150 px wide once the
  // date, the sparkline and the distance have had their share, and the name
  // was losing to buttons that get pressed once a month.
  const items = [];
  if (r.cloud) {
    const state = t('row.' + (r.visibility === 'link' ? 'shared' : r.visibility));
    items.push(item('share', `data-id="${r.id}"`,
      r.visibility === 'private' ? '🔒' : r.visibility === 'public' ? '🌍' : '🔗',
      `${t('row.menu.share')} — ${state}`));
  }
  items.push(item('gpx', ident, '⤓', t('row.menu.gpx')));
  // Only on the route the log belongs to. A menu entry that downloads another
  // run's diagnostic, or nothing at all, is worse than no entry.
  if (diagSlug && (r.slug === diagSlug || r.id === diagSlug)) {
    items.push(item('diag', '', '🩺', t('row.menu.diag')));
  }
  items.push(item('rm', `${ident} data-name="${escapeHtml(r.name)}"`, '🗑',
    t('row.menu.del'), 'danger'));

  return link + `
    <span class="more">
      <button type="button" class="dots" aria-haspopup="true" aria-expanded="false"
        title="${t('row.more')}" aria-label="${t('row.more')}">⋯</button>
      <span class="sheet" role="menu" hidden>${items.join('')}</span>
    </span>`;
}

/** One line in a row's dots menu: an icon, and the words a menu can afford. */
function item(cls, data, icon, label, extra = '') {
  return `<button type="button" role="menuitem" class="${cls === 'rm' ? 'rm' : 'dl ' + cls} ${extra}" ${data}>`
    + `<i class="ic">${icon}</i><span>${label}</span></button>`;
}

/* ---------- the figures ----------
 * What the library adds up to, and the best of it.
 *
 * Totals are free: every row already carries its own summary. Best efforts
 * are not — they are measured from the points, and the list query leaves the
 * points behind on purpose, because downloading every track to draw a page of
 * summaries would be absurd. So the ones already in hand are shown at once and
 * the account's are fetched behind them, newest first, for the routes that
 * could possibly hold a best: on foot, long enough, and timed. `moving_s` is
 * the tell for that last one — a track with no timestamps has no moving time.
 */
const km = m => (m / 1000).toFixed(m < 10000 ? 2 : 1);
const EFFORT_FETCH_MAX = 40;         // a cap, so a big library cannot stampede

function paintFigures() {
  const routes = all();
  const fig = document.getElementById('figures');
  fig.hidden = !routes.length;
  if (!routes.length) return;

  const tot = totals(routes);
  document.getElementById('totals').innerHTML = [
    [t('routes.total'), tot.routes, ''],
    [t('routes.distance'), km(tot.distance_m), 'km'],
    [t('routes.moving'), clock(tot.moving_s), ''],
    [t('routes.climbed'), Math.round(tot.gain_m).toLocaleString(), 'm'],
  ].map(([k, v, u]) => `<div><dt>${k}</dt><dd>${v}${u ? `<small>${u}</small>` : ''}</dd></div>`).join('');

  const pb = personalBests(routes);
  const got = EFFORTS.filter(e => pb[e.key]);
  const busy = effortsPending
    ? `<span class="busy">${t('routes.best.busy', { n: effortsPending })}</span>` : '';
  document.getElementById('bests').innerHTML = got.length
    ? `<span class="lbl">${t('routes.best')}</span>` + got.map(e => {
        const b = pb[e.key];
        const r = routes.find(x => x.slug === b.slug);
        const label = `${e.label} <b>${clock(b.seconds)}</b> <span style="color:var(--ink-3)">${pace(b.seconds, e.metres)}/km</span>`;
        return r ? `<a href="${routeHref(r)}" title="${escapeHtml(b.route)}">${label}</a>` : `<span>${label}</span>`;
      }).join('') + busy
    : `<span class="lbl">${t('routes.best')}</span><span class="none">${t('routes.best.none')}</span>${busy}`;
}

let effortsPending = 0;

async function fetchEffortTracks() {
  const want = cloudRoutes.filter(r => !r.track?.secs
    && ON_FOOT.has(r.activity)
    && (r.stats?.moving_s ?? 0) > 0
    && (r.stats?.distance_m ?? 0) >= EFFORTS[0].metres)
    .slice(0, EFFORT_FETCH_MAX);
  if (!want.length) return;
  effortsPending = want.length;
  paintFigures();
  for (const r of want) {
    try {
      const full = await account.routes().route(r.id);
      r.track = full.track;
    } catch { /* one route short of a best effort is not worth a message */ }
    effortsPending--;
    paintFigures();
  }
}

function render() {
  const routes = all();
  const cloud = routes.filter(r => r.cloud).length, local = routes.length - cloud;
  document.getElementById('count').textContent = !routes.length ? ''
    : [cloud ? t('routes.count.cloud', { n: cloud }) : '', local ? t('routes.count.local', { n: local }) : '']
        .filter(Boolean).join(' · ');

  const nowt = document.getElementById('nowt');
  nowt.hidden = !!routes.length;
  if (!routes.length) {
    const signedOut = account.enabled() && !account.user();
    document.getElementById('nowt-cta').hidden = !signedOut;
    document.getElementById('nowt-why').innerHTML = t(signedOut ? 'routes.empty.out' : 'routes.empty.in');
  }

  paintFigures();
  grid.innerHTML = routeDiary(routes, { actions });

  /**
   * The dots menus.
   *
   * One open at a time, closed by a press anywhere else, by Escape, and by
   * choosing something from it. The last of those matters most: every item in
   * here either opens a dialog or starts a download, and a menu still hanging
   * over the dialog it opened is the kind of thing that gets tapped twice.
   */
  const closeMenus = except => grid.querySelectorAll('.more').forEach(m => {
    if (m === except) return;
    m.querySelector('.sheet').hidden = true;
    m.querySelector('.dots').setAttribute('aria-expanded', 'false');
    m.closest('.acts')?.classList.remove('open');
  });
  grid.querySelectorAll('.more').forEach(m => {
    const dots = m.querySelector('.dots'), sheet = m.querySelector('.sheet');
    dots.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const open = sheet.hidden;
      closeMenus(m);
      sheet.hidden = !open;
      dots.setAttribute('aria-expanded', String(open));
      // see .acts.open in ui.css: this is what puts the menu above the rows
      // under it, rather than merely in front of its own row
      m.closest('.acts')?.classList.toggle('open', open);
      // Flip upwards near the bottom of the window, so the last row's menu
      // does not open off the end of the page where it cannot be reached.
      if (open) {
        const room = window.innerHeight - dots.getBoundingClientRect().bottom;
        m.classList.toggle('up', room < sheet.scrollHeight + 24);
      }
    });
    sheet.addEventListener('click', () => closeMenus(null));
  });

  grid.querySelectorAll('.dl.share').forEach(b =>
    b.addEventListener('click', e => { e.preventDefault(); openShare(b.dataset.id); }));

  /**
   * One tap, link on the clipboard.
   *
   * The old way out of here was the visibility dialog, three radio buttons and
   * a Copy inside it — correct, and far too much ceremony for "send this to my
   * sister". A private route is opened up to a link on the way, which is what
   * pressing a share button asks for, and the button says so rather than doing
   * it quietly.
   */
  grid.querySelectorAll('.dl.copy').forEach(b => b.addEventListener('click', async e => {
    e.preventDefault();
    const route = all().find(r => (b.dataset.id && r.id === b.dataset.id)
      || (b.dataset.slug && r.slug === b.dataset.slug));
    b.disabled = true;
    const res = await shareRoute(route, { cloud: account.routes() });
    b.disabled = false;
    b.classList.toggle('done', res.ok);
    setTimeout(() => b.classList.remove('done'), 2500);
    toast(res.why);
    if (res.opened) {
      cloudRoutes = cloudRoutes.map(r => (r.id === route.id ? route : r));
      render();
    }
  }));

  // Export a route this browser holds. The track is rebuilt into GPX rather
  // than a copy of the file being kept around: for anything this app recorded
  // that is the same points it captured, and it means an imported route can be
  // taken back out too.
  grid.querySelectorAll('.dl.gpx').forEach(b => b.addEventListener('click', async e => {
    e.preventDefault();
    let entry = all().find(r => (b.dataset.id && r.id === b.dataset.id)
      || (b.dataset.slug && r.slug === b.dataset.slug));
    if (!entry) return toast(t('toast.gone'));
    b.disabled = true;
    try {
      // A route listed from the account carries its summary but not its
      // points — the list query leaves those behind on purpose — so the full
      // row is fetched before there is anything to write out.
      if (!entry.track?.lat?.length && entry.cloud) {
        entry = { ...(await account.routes().route(entry.id)), cloud: true };
      }
      if (!entry.track?.lat?.length) throw new Error(t('toast.gone'));
      const gpx = trackToGPX(entry.track, { name: entry.name, activity: entry.activity ?? entry.track?.activity ?? 'other' });
      const how = await saveGPX(safeName(entry.name), gpx);
      // Only when the file was written somewhere. A 'shared' result means the
      // Android share sheet has already come up and been dealt with, so a
      // toast telling them to choose where to send it arrives after they have.
      if (how !== 'shared') toast(t('toast.saved', { name: safeName(entry.name) }));
    } catch (err) {
      toast(t('toast.savefail', { why: err.message }));
    } finally { b.disabled = false; }
  }));

  // These buttons are small and sit beside each other, and the route behind
  // one of them may be the only copy in existence. One stray tap is not
  // consent to destroy it.
  /**
   * Write the flight recorder's log out as a file.
   *
   * The same route out of the app as a GPX — the system share sheet — because
   * it is the one that already works on a phone with no cable and no desktop
   * anywhere near it.
   */
  grid.querySelectorAll('.dl.diag').forEach(b => b.addEventListener('click', async e => {
    e.preventDefault();
    const d = lastDiag();
    if (!d) return toast(t('diag.none'));
    b.disabled = true;
    try {
      const s = d.summary ?? summarise(d);
      const stamp = (d.started || new Date().toISOString()).slice(0, 19).replace(/[:T]/g, '-');
      const how = await saveGPX(`salpicon-diag-${stamp}.json`, JSON.stringify({ ...d, summary: s }, null, 1));
      if (how !== 'shared') {
        toast(t('diag.saved', { n: s?.fixes ?? 0, gap: s?.gap_max_s ?? 0, acc: Math.round(s?.accuracy_median_m ?? 0) }));
      }
    } catch (err) {
      toast(t('toast.savefail', { why: err.message }));
    } finally { b.disabled = false; }
  }));

  grid.querySelectorAll('.rm').forEach(b => b.addEventListener('click', e => {
    e.preventDefault();
    askDelete({ slug: b.dataset.slug, id: b.dataset.id, name: b.dataset.name || '' });
  }));
}

/* ---------- deleting one ---------- */
const askEl = document.getElementById('ask');
let askTarget = null;

function askDelete({ slug, id, name }) {
  const entry = all().find(r => (id && r.id === id) || (slug && r.slug === slug));
  if (!entry) return toast(t('toast.gone'));
  askTarget = entry;
  // Three different situations, three different warnings. A route in the
  // account disappears from every device at once; one held only here has no
  // copy anywhere; saying the same sentence for both would understate one and
  // overstate the other.
  document.getElementById('ask-body').innerHTML = t(
    entry.cloud ? 'del.body.cloud' : entry.local ? 'del.body.only' : 'del.body',
    { name: escapeHtml(name || entry.name || '') });
  askEl.classList.add('on');
  document.getElementById('ask-no').focus();
}
const closeAsk = () => { askEl.classList.remove('on'); askTarget = null; };
document.getElementById('ask-no').addEventListener('click', closeAsk);
askEl.addEventListener('click', e => { if (e.target === askEl) closeAsk(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && askEl.classList.contains('on')) closeAsk(); });
document.getElementById('ask-yes').addEventListener('click', async () => {
  if (!askTarget) return;
  const target = askTarget;
  const yes = document.getElementById('ask-yes');
  yes.disabled = true;
  const was = yes.textContent;
  yes.textContent = t('del.working');
  try {
    if (target.cloud) {
      await account.routes().remove(target.id);
      cloudRoutes = cloudRoutes.filter(r => r.id !== target.id);
    }
    // A route that was uploaded may still have a copy here; take both.
    if (target.slug) removeLocalRoute(target.slug);
    closeAsk();
    render();
    toast(t('del.done'));
  } catch (err) {
    // Left on screen on purpose: a delete that failed and closed quietly looks
    // exactly like one that worked, right up until the route reappears.
    toast(t('del.failed', { why: err?.message || err }));
  } finally {
    yes.disabled = false;
    yes.textContent = was;
  }
});

/* ---------- adding files ---------- */
async function ingest(files) {
  const gpx = [...files].filter(f => /\.gpx$/i.test(f.name));
  if (!gpx.length) return toast(t('toast.notgpx'));
  let last = null, added = 0;
  for (const file of gpx) {
    try {
      const track = analyze(parseGPX(await file.text()));
      last = addLocalRoute(file.name, track, profileSamples(track, 96));
      added++;
    } catch (err) {
      toast(`${file.name}: ${err.message}`);
    }
  }
  if (!added) return;
  render();
  toast(added === 1 ? t('toast.added.one', { name: last.name })
                    : t('toast.added.many', { n: added }));
  if (added === 1) setTimeout(() => { location.href = `./view.html?local=${encodeURIComponent(last.slug)}`; }, 700);
}

document.getElementById('add').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', e => { ingest(e.target.files); e.target.value = ''; });

const dropEl = document.getElementById('drop');
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) dropEl.classList.add('on'); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
  ingest(e.dataTransfer.files);
});

/* ---------- who can see a route ---------- */
/**
 * Three states rather than a switch, because "anyone with the link" is a real
 * third thing and collapsing it into public or private misrepresents what
 * happens. The link is shown only when it can actually be used, and replacing
 * it is offered next to it with a warning, since revoking access is the whole
 * reason the token can be rotated.
 */
const shareEl = document.getElementById('share');
const shareMsg = document.getElementById('share-msg');
let sharing = null;                       // the route being configured

function paintShare() {
  const url = sharing ? routeLink(sharing) : null;
  document.getElementById('share-link').hidden = !url;
  if (url) document.getElementById('share-url').value = url;
  for (const i of document.querySelectorAll('#share-opts input')) i.checked = i.value === sharing?.visibility;
}

function openShare(id) {
  sharing = cloudRoutes.find(r => r.id === id);
  if (!sharing) return;
  shareMsg.textContent = '';
  paintShare();
  shareEl.classList.add('on');
}

document.getElementById('share-opts').addEventListener('change', async e => {
  if (!sharing) return;
  const visibility = e.target.value;
  shareMsg.textContent = t('share.saving');
  shareMsg.classList.add('ok');
  try {
    const updated = await account.routes().setVisibility(sharing.id, visibility);
    sharing = { ...sharing, ...updated, cloud: true };
    cloudRoutes = cloudRoutes.map(r => (r.id === sharing.id ? sharing : r));
    shareMsg.textContent = t(visibility === 'private' ? 'share.nowprivate' : 'share.saved');
    paintShare();
    render();
  } catch (err) {
    shareMsg.classList.remove('ok');
    shareMsg.textContent = account.explain(err);
  }
});

document.getElementById('share-copy').addEventListener('click', async () => {
  const res = await shareRoute(sharing, { cloud: account.routes() });
  shareMsg.classList.toggle('ok', res.ok);
  shareMsg.textContent = res.why;
  if (res.opened) { paintShare(); render(); }
});

document.getElementById('share-rotate').addEventListener('click', async () => {
  if (!sharing) return;
  shareMsg.classList.add('ok');
  shareMsg.textContent = t('share.replacing');
  try {
    const fresh = await account.routes().rotateShareToken(sharing.id);
    sharing = { ...sharing, shareToken: fresh };
    cloudRoutes = cloudRoutes.map(r => (r.id === sharing.id ? sharing : r));
    paintShare();
    shareMsg.textContent = t('share.replaced');
  } catch (err) {
    shareMsg.classList.remove('ok');
    shareMsg.textContent = account.explain(err);
  }
});

document.getElementById('share-close').addEventListener('click', () => shareEl.classList.remove('on'));
shareEl.addEventListener('click', e => { if (e.target === shareEl) shareEl.classList.remove('on'); });

/* ---------- accounts ----------
 * The sign-in form itself lives on the landing page; from here the two buttons
 * go there rather than this page carrying a second copy of the dialog.
 */
for (const [id, mode] of [['nowt-up', 'up'], ['nowt-in', 'in']]) {
  document.getElementById(id).addEventListener('click', () => { location.href = `./?signin=${mode}`; });
}

await account.ready();
document.getElementById('acctbtn').hidden = !account.enabled();
document.getElementById('acctbtn').addEventListener('click', () => { location.href = './?signin=in'; });

// Dismissing an open dots menu. Registered once, on the document, because the
// rows themselves are replaced on every repaint and a listener attached to
// them would be lost with them.
const shutMenus = () => document.querySelectorAll('.more .sheet:not([hidden])').forEach(sh => {
  sh.hidden = true;
  sh.parentElement.querySelector('.dots')?.setAttribute('aria-expanded', 'false');
  sh.closest('.acts')?.classList.remove('open');
});
document.addEventListener('click', shutMenus);
document.addEventListener('keydown', e => { if (e.key === 'Escape') shutMenus(); });
window.addEventListener('scroll', shutMenus, { passive: true });
account.onChange(user => {
  const btn = document.getElementById('acctbtn');
  btn.hidden = !account.enabled();
  btn.removeAttribute('data-i18n');
  btn.textContent = user ? (user.email?.split('@')[0] ?? t('nav.account')) : t('nav.signin');
  refreshCloud();
});

/* Anything still only on this device goes up from here too, so a route does
 * not sit waiting just because the person opened their routes rather than the
 * landing page. */
startSync();
onSync(s => {
  if (s.state === 'uploading' && s.total) toast(t('sync.uploading', s));
  else if (s.state === 'done' && s.done) { toast(t(s.done === 1 ? 'sync.done.one' : 'sync.done.many', { n: s.done })); refreshCloud(); }
  else if (s.state === 'failed' && s.failed) toast(t('sync.failed', { n: s.failed }));
  else render();
});

render();
</script>
</body>
</html>
