# Builds the Android app. Nothing here needs Android Studio: the runner image
# already carries the JDK and the Android SDK, and the native project in
# android/ was generated once by `npx cap add android` and committed.
#
#   push a tag  -> a signed release build, .apk and .aab
#   run by hand -> whatever you point it at
#
# Signing needs four repository secrets. Without them the release step is
# skipped and only the debug build runs, so a fork still gets a green tick:
#   KEYSTORE_B64       base64 of your release.jks
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias inside the store
#   KEY_PASSWORD       key password
name: android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed release (needs the signing secrets)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: the Capacitor CLI refuses to run on anything older, and the
      # only sign of it is `cap sync` failing after the web build has already
      # succeeded — which reads like a problem with the app rather than with
      # the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The tag is the only place a version number is written down. Deriving
      # both figures from it means they cannot drift apart, and that nobody
      # uploads versionCode 1 twice — which Play rejects, permanently, for
      # that number.
      #
      #   v0.1.0  ->  versionName 0.1.0   versionCode 100
      #   v1.2.3  ->  versionName 1.2.3   versionCode 10203
      #
      # A build started by hand has no tag, so it stays on 0.0.0 and takes the
      # run number as its code: installable, never uploadable.
      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH, so no version can be derived from it"
              exit 1
            fi
            IFS=. read -r a b c <<< "$name"
            code=$(( a * 10000 + b * 100 + c ))
            [ "$code" -gt 0 ] || { echo "::error::v0.0.0 has no usable versionCode"; exit 1; }
          else
            name="0.0.0"
            code="${{ github.run_number }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "building $name (versionCode $code)"

      # The APK bundles whatever dist/ contains, config.json included — so an
      # app built with none of these set has no account database behind it and
      # falls back to the open tile endpoint. That is a perfectly good offline
      # build and a confusing thing to hand a tester, who presses Sign in and
      # finds nothing there. All three are public values (the publishable key
      # names the project and row-level security does the rest; the Esri key is
      # already served to every browser that opens the site), but they are
      # values that cost money or identify a project, so they live in repository
      # secrets rather than in this file.
      - name: Build the web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
        run: |
          npm ci
          npm run build
          node -e "
            const c = require('./dist/config.json');
            console.log('accounts:', c.supabaseUrl ? 'configured' : 'OFF — set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY');
            console.log('imagery :', c.esriKey ? 'licensed Esri key' : 'open endpoint — set ESRI_API_KEY');
          "

      - name: Copy it into the native project
        run: npx cap sync android

      # The key never touches the repository: it arrives as base64 in a secret,
      # is written outside the source tree, and the runner is thrown away after.
      - name: Restore the signing key
        id: signing
        if: ${{ github.ref_type == 'tag' || inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no signing secrets configured — debug build only"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          SALPICON_KEYSTORE: ${{ runner.temp }}/release.jks
          SALPICON_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SALPICON_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SALPICON_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SALPICON_VERSION_NAME: ${{ steps.ver.outputs.name }}
          SALPICON_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew bundleRelease assembleRelease

      # Check the signature here rather than finding out at the Play console.
      # An unsigned release still assembles and still uploads as an artifact,
      # so without this the first sign that the signing config is wrong is a
      # rejected upload — which is a long way from the commit that caused it.
      - name: Check the release really is signed
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -eu
          aab=$(find android/app/build/outputs/bundle -name '*.aab' | head -1)
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$aab" ] || { echo "::error::no .aab was produced"; exit 1; }
          [ -n "$apk" ] || { echo "::error::no .apk was produced"; exit 1; }
          echo "verifying $aab"
          jarsigner -verify -strict "$aab" > /dev/null
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -1)
          if [ -n "$signer" ]; then
            echo "verifying $apk"
            "$signer" verify --print-certs "$apk"
          else
            echo "no apksigner on this image; verified the bundle only"
          fi
          unzip -p "$apk" AndroidManifest.xml > /dev/null || true
          echo "signed: ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})"

      - name: Assemble debug
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        env:
          SALPICON_VERSION_NAME: ${{ steps.ver.outputs.name }}
          SALPICON_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: salpicon-android-${{ steps.ver.outputs.name }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
