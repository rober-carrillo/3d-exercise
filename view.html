<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Salpicón!</title>
<meta name="theme-color" content="#fcf1ee">
<script>try{var t=localStorage.getItem('salpicon.theme.v1');document.documentElement.dataset.theme=t==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="icon" href="./brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./brand/apple-touch-icon.png">
<link rel="stylesheet" href="./src/ui.css">
<style>html,body{height:100%;overflow:hidden}
/* When a route cannot be opened. This page is only ever one route, so there is
   no chrome to keep — but a bare sentence on an empty page reads as a crash,
   and the thing somebody needs most at that moment is the way back. */
.msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:32px;text-align:center;background:var(--bg)}
.msg h1{margin:0;font:600 19px/1.3 var(--font);color:var(--ink)}
.msg p{margin:0;max-width:44ch;font:15px/1.6 var(--font);color:var(--ink-2)}
.msg a.back{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font:600 15px/1 var(--font);
  padding:12px 20px;border-radius:10px;background:var(--accent);color:var(--on-accent);text-decoration:none}
.msg a.back:hover{background:var(--accent-2)}</style>
</head>
<body>
<script type="module">
import { RouteViewer } from './src/viewer.js';
import { getLocalRoute } from './src/library.js';
import { shareRoute } from './src/share.js';
import { initTheme } from './src/theme.js';
import { initLang, t } from './src/i18n.js';

initTheme();
initLang();

/**
 * The viewer's own "Copy link to this route".
 *
 * Which link that is depends entirely on where the route lives, and the viewer
 * has no business knowing: it is handed a function and told what to put on the
 * button. A route that is only in this browser has no link at all, and says so
 * rather than producing an address that opens nothing for anybody else.
 */
const sharer = (route, cloud = null) => () => shareRoute(route, { cloud });

const params = new URLSearchParams(location.search);
const localSlug = params.get('local');
const cloudId = params.get('cloud');
const fail = (title, body, href = './routes.html') => {
  document.body.innerHTML = `<div class="msg"><h1></h1><p></p>`
    + `<a class="back" href="${href}">← ${t('nav.back')}</a></div>`;
  // set as text, not markup: these carry a route's name and an error from the
  // server, neither of which is ours to trust as HTML
  document.querySelector('.msg h1').textContent = title;
  document.querySelector('.msg p').textContent = body;
};

if (cloudId) {
  // a route that lives in the account; row-level security decides whether this
  // request is allowed to see it, so a wrong id simply finds nothing
  const { ready, enabled, routes } = await import('./src/account.js');
  await ready();
  if (!enabled()) {
    fail(t('view.noaccount.title'), t('view.noaccount.body'), './');
  } else {
    try {
      const entry = await routes().route(cloudId);
      document.title = entry.name + ' · Salpicón!';
      entry.cloud = true;
      window.viewer = new RouteViewer({
        mount: document.body, track: entry.track, name: entry.name, backHref: './routes.html',
        date: entry.date, onShare: sharer(entry, routes()),
      });
    } catch (err) {
      fail(t('view.nocloud.title'), t('view.nocloud.body'), './routes.html');
    }
  }
} else if (localSlug) {
  // a route this browser added — its data lives in localStorage, not the build
  const entry = getLocalRoute(localSlug);
  if (!entry) {
    fail(t('view.nolocal.title'), t('view.nolocal.body'), './routes.html');
  } else {
    document.title = entry.name + ' · Salpicón!';
    window.viewer = new RouteViewer({
      mount: document.body, track: entry.track, name: entry.name, backHref: './routes.html',
      date: entry.date || entry.added, onShare: sharer({ ...entry, local: true }),
    });
  }
} else {
  const manifest = await fetch('./routes.json').then(r => r.json()).catch(() => ({ routes: [] }));
  const entry = manifest.routes.find(r => r.slug === params.get('route')) || manifest.routes[0];
  if (!entry) {
    fail(t('view.nonone.title'), t('view.nonone.body'), './');
  } else {
    document.title = entry.name + ' · Salpicón!';
    window.viewer = new RouteViewer({
      mount: document.body, gpxUrl: './routes/' + entry.file, name: entry.name,
      backHref: './library.html', date: entry.date, onShare: sharer({ ...entry, cloud: false, local: false }),
    });
  }
}
</script>
</body>
</html>
